<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面不存在 - MD 预览</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #eef1f4;
      color: #1c232b;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #161a1f; color: #e8edf2; }
    }
    main { text-align: center; padding: 24px; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #8494a3; font-size: 0.95rem; }
    a {
      color: #d35400;
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, #d35400 35%, transparent);
    }
  </style>
</head>
<body>
  <main>
    <h1>页面不存在</h1>
    <p>没有找到这个地址。</p>
    <a href="/">返回 MD 预览</a>
  </main>
</body>
</html>
