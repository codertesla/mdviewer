name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # lib/ 是提交进仓库的产物，确保它和 package.json 里的版本一致
      - run: npm run vendor
      - run: git diff --exit-code -- lib/
