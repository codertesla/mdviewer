<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD 预览 - Markdown 实时渲染</title>
  <meta name="description" content="本地 Markdown 实时预览：输入、拖入或打开 .md，即时渲染，支持全屏阅读与目录导航。">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button type="button" class="brand" id="btn-brand" title="回到编辑">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 20V4l7 12 7-12v16"/>
      </svg>
      <h1>MD 预览</h1>
    </button>
    <div class="topbar-actions">
      <button id="btn-sample" class="btn edit-only" type="button" title="载入示例文档">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg>
        <span class="btn-label">示例</span>
      </button>
      <button id="btn-clear" class="btn edit-only" type="button" title="清空内容">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>
        <span class="btn-label">清空</span>
      </button>
      <button id="btn-open" class="btn btn-primary edit-only" type="button" title="打开本地 Markdown 文件（⌘/Ctrl+O）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20V7a2 2 0 0 1 2-2h4l2 3h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2Z"/></svg>
        <span class="btn-label">打开 .md</span>
      </button>
      <button id="btn-export" class="btn" type="button" title="导出为独立 HTML 文件（⌘/Ctrl+S）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>
        <span class="btn-label">导出 HTML</span>
      </button>
      <div class="docs-wrap">
        <button id="btn-docs" class="btn" type="button" title="已保存的文档" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span class="btn-label">文档</span>
          <span id="docs-count" class="badge" hidden>0</span>
        </button>
        <div id="docs-panel" class="docs-panel" hidden>
          <div class="docs-head">已保存的文档</div>
          <div id="docs-empty" class="docs-empty">暂无已保存的文档<br>上传或拖入的 .md 会自动出现在这里</div>
          <ul id="docs-list" class="docs-list"></ul>
          <div class="docs-foot">
            <button id="docs-clear" class="btn btn-small" type="button">清空全部</button>
          </div>
        </div>
      </div>
      <button id="btn-fullscreen" class="btn btn-icon" type="button" title="预览模式（⌘/Ctrl+\\，Esc 退出）" aria-pressed="false">
        <svg id="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <svg id="icon-compress" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20v-5h5M20 20v-5h-5M4 4v5h5M20 4v5h-5"/></svg>
      </button>
      <button id="btn-theme" class="btn btn-icon" type="button" title="切换亮色 / 暗色主题">
        <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-left">
      <span id="word-count" class="count">0 字符</span>
      <span class="count-sep" aria-hidden="true"></span>
      <span id="view-hint" class="count">左右栏同步滚动</span>
    </div>
    <div class="tabs" id="mobile-tabs">
      <button id="tab-edit" class="tab active" type="button">编辑</button>
      <button id="tab-preview" class="tab" type="button">预览</button>
    </div>
  </div>

  <main class="workspace">
    <section class="pane editor-pane" id="editor-pane">
      <div class="pane-label">编辑</div>
      <textarea id="editor" class="editor" spellcheck="false" placeholder="在此输入 Markdown 文本，或拖入 .md 文件…" aria-label="Markdown 编辑器"></textarea>
    </section>
    <section class="pane preview-pane" id="preview-pane">
      <div class="pane-label">预览</div>
      <article id="preview" class="preview" aria-label="渲染结果" tabindex="-1"></article>
      <button id="toc-toggle" class="btn btn-icon toc-toggle" type="button" title="目录" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      </button>
      <button id="back-top" class="btn btn-icon back-top" type="button" title="回到顶部" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </section>
  </main>

  <nav id="toc" class="toc" aria-label="目录" hidden>
    <div class="toc-head">
      <span>目录</span>
      <button id="toc-close" class="btn btn-icon" type="button" title="关闭目录" aria-label="关闭目录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <ul id="toc-list" class="toc-list"></ul>
  </nav>

  <div id="reading-progress" class="reading-progress" aria-hidden="true"></div>

  <input type="file" id="file-input" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
  <div id="drop-veil" class="drop-veil" hidden>松开以导入文件</div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="lib/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
